[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "photonicslab"
version = "0.6.0a1"
description = "A composable, local-first virtual optics bench for teaching and reproducible research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
authors = [{name = "Nyameko Lisa"}]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1", "build>=1,<2", "nbclient>=0.10,<1"]

[project.scripts]
photonicslab = "photonicslab.cli:main"

[project.urls]
Repository = "https://github.com/nyameko/photonicslab"

[tool.hatch.build.targets.wheel]
packages = ["src/photonicslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py", "integration_tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
